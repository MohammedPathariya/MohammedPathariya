<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="880px" height="430px" font-size="15px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #b35900;}
.value {fill: #0969da;}
.addColor {fill: #3fb950;}
.delColor {fill: #f85149;}
.cc {fill: #6e7781;}
.prompt {fill: #1a7f37;}
.dim {fill: #57606a;}
text, tspan {white-space: pre;}
</style>
<rect width="880px" height="430px" fill="#f6f8fa" rx="12"/>
<!-- header -->
<text x="24" y="34" fill="#24292f">
<tspan class="prompt">mohammed@training_run</tspan><tspan class="dim"> ~ %</tspan> <tspan class="dim">tail -f run.log</tspan>
</text>
<text x="24" y="54" class="cc">
<tspan>────────────────────────────────────────────────────────────────────────</tspan>
</text>
<!-- init block -->
<text x="24" y="82" fill="#24292f">
<tspan x="24" y="82"><tspan class="dim">[INIT]</tspan> <tspan class="key">model</tspan>        <tspan class="cc">:</tspan> <tspan class="value">Mohammed Pathariya</tspan></tspan>
<tspan x="24" y="106"><tspan class="dim">[INIT]</tspan> <tspan class="key">framework</tspan>    <tspan class="cc">:</tspan> <tspan class="value">PyTorch, HuggingFace, TRL, CrewAI</tspan></tspan>
<tspan x="24" y="130"><tspan class="dim">[INIT]</tspan> <tspan class="key">architecture</tspan> <tspan class="cc">:</tspan> <tspan class="value">Grad Researcher — Indiana University</tspan></tspan>
<tspan x="24" y="154"><tspan class="dim">[INIT]</tspan> <tspan class="key">objective</tspan>    <tspan class="cc">:</tspan> <tspan class="value">ML / AI Engineering | Data Engineering</tspan></tspan>
<tspan x="24" y="178"><tspan class="dim">[INIT]</tspan> <tspan class="key">compute</tspan>      <tspan class="cc">:</tspan> <tspan class="value">Docker, HPC Clusters, Azure, GCP</tspan></tspan>
<tspan x="24" y="202"><tspan class="dim">[INIT]</tspan> <tspan class="key">params</tspan>       <tspan class="cc">:</tspan> <tspan class="value">Python, SQL</tspan></tspan>
</text>
<text x="24" y="226" class="cc">
<tspan>────────────────────────────────────────────────────────────────────────</tspan>
</text>
<!-- run block -->
<text x="24" y="254" fill="#24292f">
<tspan x="24" y="254"><tspan class="dim">[RUN]</tspan>  <tspan class="key">training since</tspan><tspan class="cc" id="training_data_dots"> .... </tspan><tspan class="value" id="training_data">5 years, 11 months</tspan> <tspan class="dim">(Aug 2020)</tspan></tspan>
<tspan x="24" y="278"><tspan class="dim">[RUN]</tspan>  <tspan class="key">checkpoint</tspan>    <tspan class="cc">:</tspan> <tspan class="value">RLHF / DPO post-training study</tspan></tspan>
</text>
<text x="24" y="302" class="cc">
<tspan>────────────────────────────────────────────────────────────────────────</tspan>
</text>
<!-- metrics block -->
<text x="24" y="330" fill="#24292f">
<tspan class="prompt">mohammed@training_run</tspan><tspan class="dim"> ~ %</tspan> <tspan class="dim">github --metrics</tspan>
</text>
<text x="24" y="358" fill="#24292f">
<tspan x="24" y="358"><tspan class="key">repos</tspan><tspan class="cc" id="repo_data_dots"> .... </tspan><tspan class="value" id="repo_data">0</tspan> <tspan class="dim">{contributed:</tspan> <tspan class="value" id="contrib_data">0</tspan><tspan class="dim">}</tspan>   <tspan class="key">stars</tspan><tspan class="cc" id="star_data_dots"> .... </tspan><tspan class="value" id="star_data">0</tspan></tspan>
<tspan x="24" y="382"><tspan class="key">commits</tspan><tspan class="cc" id="commit_data_dots"> .... </tspan><tspan class="value" id="commit_data">0</tspan>   <tspan class="key">followers</tspan><tspan class="cc" id="follower_data_dots"> .... </tspan><tspan class="value" id="follower_data">0</tspan></tspan>
<tspan x="24" y="406"><tspan class="key">lines of code</tspan><tspan class="cc" id="loc_data_dots"> .. </tspan><tspan class="value" id="loc_data">0</tspan> <tspan class="dim">(</tspan><tspan class="addColor" id="loc_add">0</tspan><tspan class="addColor">++</tspan><tspan class="dim">,</tspan><tspan class="cc" id="loc_del_dots"> </tspan><tspan class="delColor" id="loc_del">0</tspan><tspan class="delColor">--</tspan><tspan class="dim">)</tspan></tspan>
</text>
